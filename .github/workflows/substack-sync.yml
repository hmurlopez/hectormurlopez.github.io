# Syncs the latest Substack essays into posts.json, which the Writing
# section on the homepage renders client-side.
#
# Notes:
# - Scheduled workflows only run from the default branch — the cron does
#   nothing until this file lands on main. Use "Run workflow" (the
#   workflow_dispatch button in the Actions tab) to test it after merge.
# - GitHub disables schedules after 60 days without repository activity.
#   GitHub emails a warning; re-enabling is one click in the Actions tab.
# - Pushes made with GITHUB_TOKEN don't trigger other workflows, which used
#   to be a problem on GitHub Pages. Vercel deploys from a git webhook and
#   doesn't care who pushed, so the bot's posts.json commit reaches the live
#   site on its own. See MIGRATION.md.
# - On a private repo this draws from the free 2,000 Actions minutes/month.
#   One run is about a minute, so roughly 30 minutes a month.

name: Sync Substack posts

on:
  schedule:
    - cron: '17 6 * * *'   # daily, off-the-hour to avoid cron congestion
  workflow_dispatch:
  # Also run once whenever the sync itself changes — so a merge that adds
  # or fixes this pipeline populates posts.json immediately, no manual
  # dispatch needed. The workflow's own posts.json commit doesn't match
  # these paths, so this can't loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/substack-sync.yml'
      - 'scripts/fetch-substack.mjs'

permissions:
  contents: write

concurrency:
  group: substack-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts
        run: node scripts/fetch-substack.mjs

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- posts.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "chore: sync latest Substack posts"
            git push
          else
            echo "posts.json unchanged — nothing to commit"
          fi
